name: Release GymSync

on:
  push:
    branches:
      - main
    paths:
      - 'GymsyncServer.java'
      - 'gymsyncapp.java'
      - 'gymsync_database_schema_and_seed.sql'
      - 'frontend/**'
      - 'lib/**'
      - 'build-release.ps1'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version without leading v (e.g., 2.0.0)'
        required: true
        default: '2.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build Windows portable app & runnable JAR
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ inputs.version }}"
            $tag = "v$ver"
            $releaseName = "GymSync $tag — Desk OS"
            $filesPattern = "release/GymSync-v$ver-Windows-x64.zip`nrelease/GymSync-v$ver-Runnable.jar"
            $isRolling = "false"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart('v')
            $releaseName = "GymSync $tag — Desk OS"
            $filesPattern = "release/GymSync-v$ver-Windows-x64.zip`nrelease/GymSync-v$ver-Runnable.jar"
            $isRolling = "false"
          } else {
            $ver = "2.0.0"
            $tag = "latest"
            $releaseName = "GymSync Latest Build — Desk OS"
            $filesPattern = "release/GymSync-Windows-x64.zip`nrelease/GymSync-Runnable.jar"
            $isRolling = "true"
          }

          ./build-release.ps1 -Version $ver

          if ($isRolling -eq "true") {
            Copy-Item "release/GymSync-v$ver-Windows-x64.zip" "release/GymSync-Windows-x64.zip" -Force
            Copy-Item "release/GymSync-v$ver-Runnable.jar" "release/GymSync-Runnable.jar" -Force
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_NAME=$(if ($isRolling -eq 'true') { 'GymSync-Windows-x64.zip' } else { "GymSync-v$ver-Windows-x64.zip" })" | Out-File -FilePath $env:GITHUB_ENV -Append
          "JAR_NAME=$(if ($isRolling -eq 'true') { 'GymSync-Runnable.jar' } else { "GymSync-v$ver-Runnable.jar" })" | Out-File -FilePath $env:GITHUB_ENV -Append
          "IS_LATEST=$(if ($isRolling -eq 'true') { 'false' } else { 'true' })" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false
          make_latest: ${{ env.IS_LATEST }}
          body: |
            ## Quick Download (Windows)
            1. Download **`${{ env.ZIP_NAME }}`** below.
            2. Right-click → **Extract All...** anywhere on your computer.
            3. Double-click **`GymSync.exe`** inside the extracted `GymSync` folder (Java is already bundled — no installation required).

            Or download **`${{ env.JAR_NAME }}`** if you already have Java 17+ installed (`java -jar ${{ env.JAR_NAME }}`).

            ### Demo Operator Accounts
            - **Admin Desk:** `admin` / `admin123`
            - **Staff Desk:** `staff` / `staff123`
          files: |
            release/${{ env.ZIP_NAME }}
            release/${{ env.JAR_NAME }}
